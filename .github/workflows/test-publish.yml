name: Publish release candidate to TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested immutable ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build distributions
        working-directory: core
        run: uv build
      - name: Verify distributions
        working-directory: core
        run: python scripts/verify_distribution.py dist
      - name: Smoke-test wheel
        working-directory: core
        run: |
          uv venv --python 3.12 .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          .smoke-venv/bin/python scripts/smoke_test_install.py
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: core/dist/
          if-no-files-found: error

  publish:
    name: Publish verified candidate
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/risansym
    permissions:
      id-token: write
    steps:
      - name: Download candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
